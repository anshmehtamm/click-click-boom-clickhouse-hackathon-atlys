<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Atlys Agents — Live Trace</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --border: #232838;
    --text: #e4e7ef;
    --text-dim: #838aa0;
    --accent: #5eead4;
    --accent-dim: #1f4d47;
    --amber: #f5b556;
    --red: #f0637a;
    --violet: #a78bfa;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13.5px;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ---- sidebar: trace list ---- */
  #traces {
    width: 300px; flex: 0 0 300px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #traces h1 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim); padding: 16px 16px 10px; margin: 0; display: flex; align-items: center; gap: 8px;
  }
  #conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; }
  #conn-dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #trace-list { overflow-y: auto; flex: 1; padding: 0 8px 8px; }
  .trace-item {
    padding: 10px 10px; border-radius: 8px; margin-bottom: 4px; cursor: pointer;
    border: 1px solid transparent;
  }
  .trace-item:hover { background: var(--panel-2); }
  .trace-item.active { background: var(--panel-2); border-color: var(--accent-dim); }
  .trace-item .agent { font-weight: 600; color: var(--text); }
  .trace-item .spec { color: var(--text-dim); font-size: 12px; }
  .trace-item .badge {
    display: inline-block; margin-top: 6px; font-size: 10.5px; padding: 2px 7px;
    border-radius: 20px; font-family: var(--mono); letter-spacing: 0.02em;
  }
  .badge.running { background: #2a2410; color: var(--amber); }
  .badge.done { background: var(--accent-dim); color: var(--accent); }

  /* ---- main: event stream ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar {
    padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 14px; background: var(--panel);
  }
  #toolbar .title { font-weight: 600; }
  #toolbar .sub { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
  #toolbar a { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: auto; }
  #toolbar a:hover { text-decoration: underline; }

  #stream { flex: 1; overflow-y: auto; padding: 14px 20px 40px; }
  .row {
    display: grid; grid-template-columns: 78px 22px 1fr auto; gap: 10px; align-items: start;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
  }
  .row:hover { background: var(--panel-2); }
  .row .t { color: var(--text-dim); font-family: var(--mono); font-size: 11px; padding-top: 2px; }
  .row .icon { font-size: 13px; padding-top: 1px; }
  .row .body { min-width: 0; }
  .row .step { font-family: var(--mono); font-size: 12.5px; }
  .row .step .path { color: var(--text-dim); }
  .row .reasoning {
    color: var(--text-dim); font-size: 12px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .usage { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); padding-top: 3px; white-space: nowrap; }

  .kind-generation .step { color: var(--violet); }
  .kind-tool_call .step { color: var(--amber); }
  .kind-span .step { color: var(--text-dim); font-style: italic; }
  .kind-trace .step { color: var(--accent); font-weight: 600; }

  .agent-badge {
    display: inline-block; font-size: 9.5px; font-family: var(--mono); letter-spacing: 0.02em;
    padding: 1px 6px; border-radius: 4px; margin-right: 7px; white-space: nowrap; vertical-align: 1px;
  }
  .agent-proposer  { background: #2a2140; color: var(--violet); }
  .agent-reviewer  { background: #142d3d; color: #7dd3fc; }
  .agent-chronicler{ background: #3a1f2e; color: #f0a8c8; }
  .agent-pipeline  { background: var(--panel-2); color: var(--text-dim); }

  /* tool-type badges: one per real tool family, colored so the tool-call chain's
     shape (which systems the agent touched, in what order) reads at a glance */
  .tool-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px;
    font-family: var(--mono); letter-spacing: 0.02em; padding: 1px 6px 1px 5px;
    border-radius: 4px; margin-right: 7px; white-space: nowrap; vertical-align: 1px;
  }
  .tool-context  { background: #0f2e33; color: #5eead4; }
  .tool-schema   { background: #332708; color: var(--amber); }
  .tool-query    { background: #3d2408; color: #ffb454; }
  .tool-scratch  { background: #2a2410; color: #d8c27a; }
  .tool-python   { background: #12321c; color: #7ee08a; }
  .tool-skill    { background: #241a38; color: #c8a8f0; }
  .tool-file     { background: #241f14; color: #ceb87a; }
  .tool-generic  { background: var(--panel-2); color: var(--text-dim); }

  .no-output { color: var(--text-dim); font-style: italic; }

  /* thinking/reasoning callout: the closest real signal we have to "thinking" is
     each agent's own stated rationale in its structured JSON output (LibreChat's
     Agents API returns no raw reasoning/thinking content at all -- confirmed via
     direct testing in streaming, non-streaming, and with an explicit
     reasoning.summary=auto request param, none of which surfaced anything).
     Styled as a distinct callout so it reads as "the agent's reasoning", labeled
     honestly rather than implying raw chain-of-thought. */
  .thinking {
    margin-top: 5px; padding: 7px 10px; border-left: 2px solid var(--violet);
    background: #17122a; border-radius: 0 6px 6px 0; font-size: 12px;
    color: #cfc4ea; line-height: 1.5; white-space: pre-wrap;
  }
  .thinking .label {
    display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--violet); margin-bottom: 3px; font-family: var(--mono);
  }

  .detail {
    grid-column: 1 / -1; margin: 6px 0 6px 88px; padding: 10px 12px;
    background: #0d1016; border: 1px solid var(--border); border-radius: 6px;
    font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto; color: #c3c8d6;
  }
  .detail .k { color: var(--text-dim); }

  #empty {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--text-dim); flex-direction: column; gap: 8px; text-align: center;
  }
  #empty .big { font-size: 15px; color: var(--text); }
  #empty code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="traces">
    <h1><span id="conn-dot"></span>Live Traces</h1>
    <div id="trace-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span class="title" id="tb-title">Select a trace</span>
      <span class="sub" id="tb-sub"></span>
      <a id="tb-link" href="#" target="_blank" style="display:none">open in Langfuse ↗</a>
    </div>
    <div id="stream"><div id="empty"><div class="big">Waiting for events…</div><div>Run a spec with <code>python scripts/run_instant_forex.py</code> while this dashboard is open.</div></div></div>
  </div>
</div>

<script>
const ICONS = { trace: "◆", span: "›", generation: "✦", tool_call: "⚙", log: "·" };

// The whole spec ingestion is ONE Langfuse trace by design (coherent single trace
// beats 4 disconnected ones) -- but that means "which of the 4 real LLM agents is
// this row" isn't visible from trace grouping alone. Steps are named by pipeline
// stage (propose/review/chronicle/...), which maps 1:1 to a real agent; badge each
// row with that mapping so e.g. "context reviewer" activity is visually distinct
// even though it lives inside the same trace as everything else.
function agentBadge(step) {
  if (step.startsWith("propose")) return ["Instrumentation Proposer", "agent-proposer"];
  if (step.startsWith("review")) return ["Context Reviewer", "agent-reviewer"];
  if (step.startsWith("chronicle")) return ["Context Chronicler", "agent-chronicler"];
  return ["Pipeline", "agent-pipeline"];
}

// LibreChat's function_call.arguments is always empty (confirmed via direct API
// testing), so a "skill" tool call never tells us WHICH skill loaded from its own
// payload -- only a static lookup by agent, from agents/prompts.py's AGENTS dict,
// is possible. Proposer/Reviewer have exactly one skill each (unambiguous).
// Chronicler has TWO (context-engine, context-update) since skills_enabled is an
// all-or-nothing toggle -- LibreChat has no per-skill selection -- so which ONE a
// given chronicler "skill" call loaded isn't determinable from here; shown as
// "either" rather than falsely picking one.
const SKILL_BY_AGENT = {
  "Instrumentation Proposer": "clickhouse-best-practices or context-engine",
  "Context Reviewer": "clickhouse-best-practices",
  "Context Chronicler": "context-engine or context-update",
};

// Real tool families in this pipeline (see agents/prompts.py TOOLS_NOTE /
// mcp_servers/*.py) -- names come straight from LibreChat's function_call.name,
// which IS real (unlike arguments/output, confirmed absent from the API). Ordered
// most-specific-prefix-first since e.g. "list_context_sections" and "list_tables"
// both start with "list_".
const TOOL_TYPES = [
  { test: n => n === "skill",                                    icon: "📘", label: "Skill",         cls: "tool-skill" },
  { test: n => n.startsWith("read_file"),                        icon: "📄", label: "File Read",     cls: "tool-file" },
  { test: n => n.startsWith("list_context_sections") || n.startsWith("lookup_context"),
                                                                   icon: "🗂", label: "Context Layer", cls: "tool-context" },
  { test: n => n.startsWith("run_query"),                        icon: "▶", label: "ClickHouse Query", cls: "tool-query" },
  { test: n => n.startsWith("list_tables") || n.startsWith("describe_table"),
                                                                   icon: "🛢", label: "ClickHouse Schema", cls: "tool-schema" },
  { test: n => n.startsWith("grep_scratch") || n.startsWith("read_scratch"),
                                                                   icon: "📜", label: "Scratch File",  cls: "tool-scratch" },
  { test: n => n.startsWith("execute_python"),                   icon: "🐍", label: "Python",        cls: "tool-python" },
];

function classifyTool(rawName) {
  const name = (rawName || "").replace(/_mcp_atlys_(context|data)$/, "");
  const match = TOOL_TYPES.find(t => t.test(name));
  return { name, ...(match || { icon: "⚙", label: "Tool", cls: "tool-generic" }) };
}

let traces = {};      // trace_id -> {agent, spec, url, events: [], done}
let activeTrace = null;
let order = [];       // trace_ids in first-seen order (most recent first)

const traceListEl = document.getElementById("trace-list");
const streamEl = document.getElementById("stream");
const dotEl = document.getElementById("conn-dot");

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
}

function truncate(v, n = 900) {
  if (v == null) return "";
  const s = typeof v === "string" ? v : JSON.stringify(v, null, 2);
  return s.length > n ? s.slice(0, n) + `\n… (${s.length - n} more chars)` : s;
}

function ensureTrace(ev) {
  const id = ev.trace_id || "unknown";
  if (!traces[id]) {
    traces[id] = { agent: ev.agent, spec: ev.spec, url: ev.trace_url, events: [], done: false };
    order.unshift(id);
    if (!activeTrace) activeTrace = id;
  }
  return traces[id];
}

function renderTraceList() {
  traceListEl.innerHTML = "";
  for (const id of order) {
    const t = traces[id];
    const item = document.createElement("div");
    item.className = "trace-item" + (id === activeTrace ? " active" : "");
    item.innerHTML = `
      <div class="agent">${t.agent || "?"}</div>
      <div class="spec">${t.spec || ""}</div>
      <span class="badge ${t.done ? "done" : "running"}">${t.done ? "done" : "● running"}</span>
    `;
    item.onclick = () => { activeTrace = id; renderTraceList(); renderStream(); };
    traceListEl.appendChild(item);
  }
}

function toolCallInfo(ev) {
  const m = (ev.step || "").match(/_tool\[(\d+)\]_(.+)$/);
  if (!m) return null;
  const info = { index: m[1], ...classifyTool(m[2]) };
  if (info.name === "skill") {
    const [agentLabel] = agentBadge(ev.step || "");
    info.skillName = SKILL_BY_AGENT[agentLabel] || "unknown skill";
  }
  return info;
}

function eventLabel(ev) {
  if (ev.event === "trace_start") return `trace: ${ev.agent}:${ev.spec}`;
  if (ev.event === "trace_end") return `trace complete`;
  if (ev.event === "span_start") return `▶ ${ev.step}`;
  if (ev.event === "span_end") return `◀ ${ev.step}`;
  const tool = toolCallInfo(ev);
  if (tool) {
    const displayName = tool.skillName ? `${tool.name}: ${tool.skillName}` : tool.name;
    return `<span class="tool-badge ${tool.cls}">${tool.icon} ${tool.label}</span>${displayName}`;
  }
  return ev.step;
}

function renderRow(ev, idx) {
  const row = document.createElement("div");
  row.className = "row kind-" + (ev.kind || "log");
  const icon = ICONS[ev.kind] || "·";
  const usage = ev.usage ? `${ev.usage.total ?? ""} tok` : "";
  const [badgeLabel, badgeClass] = agentBadge(ev.step || "");
  // Thinking callout: only on generation rows (the agent's own stated rationale,
  // extracted from its structured JSON output by orchestrator/pipeline.py) --
  // always visible, not hidden behind expand, since this is the actual "thinking"
  // signal being asked for.
  const thinkingHtml = (ev.kind === "generation" && ev.reasoning)
    ? `<div class="thinking"><span class="label">💭 agent's stated reasoning</span>${truncate(ev.reasoning, 600)}</div>`
    : "";
  row.innerHTML = `
    <div class="t">${fmtTime(ev.ts)}</div>
    <div class="icon">${icon}</div>
    <div class="body">
      <div class="step"><span class="agent-badge ${badgeClass}">${badgeLabel}</span>${eventLabel(ev)}</div>
      ${thinkingHtml}
    </div>
    <div class="usage">${usage}</div>
  `;
  const detail = document.createElement("div");
  detail.className = "detail";
  detail.style.display = "none";
  const parts = [];
  const tool = toolCallInfo(ev);
  if (tool) {
    const skillLine = tool.skillName
      ? `\n\n<span class="k">skill loaded</span>\n${tool.skillName}  (static lookup by agent, from ` +
        `agents/prompts.py's AGENTS dict — the tool call itself carries no name since arguments are always ` +
        `empty. Where an agent has more than one skill attached, "or" means which specific one loaded isn't ` +
        `determinable from this API, not that both loaded.)`
      : "";
    parts.push(
      `<span class="k">tool</span>\n${tool.name}  (type: ${tool.label}, call #${tool.index} in this agent turn)${skillLine}\n\n` +
      `<span class="no-output">Arguments and output are not shown — LibreChat's Agents API (beta) never returns ` +
      `function_call arguments or a function_call_output item for any tool call (confirmed empirically across ` +
      `non-streaming, streaming, and streaming-with-reasoning-param requests). The tool name and call order above ` +
      `are real; the payload isn't recoverable from this API today. This is a beta API gap, not a bug in this pipeline.</span>`
    );
  } else {
    if (ev.reasoning) parts.push(`<span class="k">reasoning (full)</span>\n${truncate(ev.reasoning, 4000)}`);
    if (ev.input != null) parts.push(`<span class="k">input</span>\n${truncate(ev.input)}`);
    if (ev.output != null) parts.push(`<span class="k">output</span>\n${truncate(ev.output)}`);
  }
  if (ev.metadata && Object.keys(ev.metadata).length) parts.push(`<span class="k">metadata</span>\n${truncate(ev.metadata)}`);
  if (ev.usage) parts.push(`<span class="k">usage</span>\n${truncate(ev.usage)}`);
  detail.innerHTML = parts.join("\n\n") || "(no detail)";
  row.onclick = () => { detail.style.display = detail.style.display === "none" ? "block" : "none"; };

  const wrap = document.createDocumentFragment();
  wrap.appendChild(row);
  wrap.appendChild(detail);
  return wrap;
}

function renderStream() {
  const t = traces[activeTrace];
  document.getElementById("tb-title").textContent = t ? `${t.agent} · ${t.spec}` : "Select a trace";
  document.getElementById("tb-sub").textContent = t ? `${t.events.length} events` : "";
  const link = document.getElementById("tb-link");
  if (t && t.url) { link.href = t.url; link.style.display = "inline"; } else { link.style.display = "none"; }

  streamEl.innerHTML = "";
  if (!t || !t.events.length) {
    streamEl.innerHTML = `<div id="empty"><div class="big">No events yet</div></div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  t.events.forEach((ev, i) => frag.appendChild(renderRow(ev, i)));
  streamEl.appendChild(frag);
  streamEl.scrollTop = streamEl.scrollHeight;
}

function handleEvent(ev) {
  const t = ensureTrace(ev);
  t.events.push(ev);
  if (ev.trace_url) t.url = ev.trace_url;
  if (ev.event === "trace_end") t.done = true;
  renderTraceList();
  if (ev.trace_id === activeTrace) renderStream();
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => dotEl.classList.add("live");
  ws.onclose = () => { dotEl.classList.remove("live"); setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    try { handleEvent(JSON.parse(msg.data)); } catch (e) { console.error(e); }
  };
}
connect();
</script>
</body>
</html>
